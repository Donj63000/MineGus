name: MinePlugin
version: ${project.version}
main: org.example.MinePlugin
api-version: "1.21"          # version reconnue par Spigot/Paper
description: "Plugin Paper 1.21.4 - copyright By V.G"

commands:
  army:
    description: Fait apparaître 5 loups + 2 golems
    usage: /army
    permission: mineplugin.army.use
  garde:
    description: Invoque, renvoie ou inspecte deux gardes royaux
    usage: |
      /garde
      /garde <invoquer|renvoyer|statut|aide>
    permission: mineplugin.garde.use
  ping:
    description: Répond « Pong ! »
    usage: /ping
  tuto:
    description: Lance ou quitte la visite guidée privée de DonjBot
    usage: /tuto
    permission: mineplugin.tuto.use
  mineur:
    description: Gestion du mineur automatisé
    usage: |
      /mineur
      /mineur list
      /mineur select <n>
      /mineur speed <slow|normal|fast>
      /mineur pattern <quarry|branch|tunnel|vein_first>
      /mineur pause|resume|stop|info|trust|untrust <joueur>
    permission: mineplugin.mineur.use
  champ:
    description: Crée un champ automatisé (labour, plantation, récolte)
    usage: /champ [Largeur]x[Longueur]
    permission: mineplugin.champ.use
  foret:
    description: Crée une forêt automatisée (plantation et récolte d’arbres)
    usage: /foret [Largeur]x[Longueur]
    permission: minegus.forester.use
  village:
    description: Génère un petit village de PNJ
    usage: /village [undo]
    permission: mineplugin.village.use
  eleveur:
    description: Crée un enclos automatisé pour l'élevage
    usage: /eleveur [list|delete <numéro>]
    permission: mineplugin.eleveur.use
  armure:
    description: Donne l'Armure du roi GIDON
    usage: /armure
    permission: mineplugin.armure.use
  marchand:
    description: Invoque un marchand PNJ personnalisé
    usage: /marchand [open [joueur]|reload]
  minegus:
    description: Aide rapide et maintenance MineGus
    usage: |
      /minegus
      /minegus fix <forestier|golems>
  job:
    description: Gestion des métiers (mineur, etc.)
    usage: |
      /job mineur
      /job info
  niveau:
    description: Affiche et administre la progression globale du joueur
    aliases: [level, progression]
    usage: |
      /niveau
      /niveau info [joueur]
      /niveau addxp <joueur> <quantité>
      /niveau setlevel <joueur> <1-100>
      /niveau reset <joueur>

  bucheron:
    description: Alias complet de la commande forêt
    usage: /bucheron [creer|statut|liste|reparer|supprimer|aide]
    permission: minegus.forester.use
permissions:
  mineplugin.army.use:
    description: Invoquer une armée temporaire avec /army
    default: op
  mineplugin.champ.use:
    description: Créer et gérer ses champs automatisés
    default: op
  mineplugin.champ.admin:
    description: Administrer tous les champs automatisés
    default: op
  mineplugin.village.use:
    description: Générer et annuler son village
    default: op
  mineplugin.village.admin:
    description: Annuler le village d'un autre joueur
    default: op
  mineplugin.eleveur.use:
    description: Créer et gérer ses enclos automatisés
    default: op
  mineplugin.eleveur.admin:
    description: Administrer tous les enclos automatisés
    default: op
  mineplugin.armure.use:
    description: Recevoir et activer l'Armure du roi GIDON
    default: op
  mineplugin.tuto.use:
    description: Lancer et quitter la visite guidée privée (/tuto)
    default: true
  mineplugin.mineur.use:
    description: Utiliser les fonctionnalités du mineur automatisé
    default: true
  mineplugin.mineur.admin:
    description: Administrer toutes les sessions du mineur
    default: op
  mineplugin.garde.use:
    description: Invoquer ou renvoyer ses gardes royaux (/garde)
    default: true
  mineplugin.marchand.spawn:
    description: Invoquer le marchand PNJ (/marchand)
    default: op
  mineplugin.marchand.open:
    description: Ouvrir le menu du marchand sans PNJ (/marchand open)
    default: op
  mineplugin.marchand.admin:
    description: Administrer le marchand (/marchand reload)
    default: op
  mineplugin.admin:
    description: Utiliser les sous-commandes d'administration de /minegus
    default: op
  mineplugin.progression.admin:
    description: Consulter et modifier le niveau global des joueurs
    default: op

  minegus.forester.use:
    description: Utiliser et gérer ses parcelles forestières
    default: true
  minegus.forester.admin:
    description: Gérer toutes les parcelles forestières
    default: op
  minegus.forester.bypass:
    description: Modifier manuellement une parcelle protégée
    default: op
softdepend:
  - WorldGuard
  - GriefPrevention
  - Lands
