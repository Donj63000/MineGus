# Configuration par défaut pour MinePlugin

# Visite guidée privée /tuto
tutorial:
  enabled: true

  # Chaque joueur reçoit son propre monde jetable. Cette limite protège le
  # serveur contre trop de générations simultanées.
  max-concurrent-sessions: 4

  # Au-delà de cette distance, le joueur est rappelé près de DonjBot.
  recall-distance: 15.0

  # Vitesse visuelle de DonjBot. 0.17 correspond à une marche lisible.
  npc-walk-speed-blocks-per-tick: 0.17

  # Les décors sont posés par lots avec un double budget (nombre + temps)
  # pour préserver le TPS, même sur une machine modeste.
  blocks-per-tick: 1000
  build-time-budget-ms: 6.0
  chunk-load-timeout-seconds: 20

  # Après la dernière explication, retour automatique à la position d'origine.
  # Mettre 0 pour laisser le joueur quitter lui-même avec /tuto.
  auto-exit-delay-seconds: 15

  world:
    # ASCII uniquement ; la valeur est nettoyée et bornée par le plugin.
    name-prefix: "minegus_tuto_"
    border-size: 800.0
    time: 6000

    # 0 = paysage différent à chaque visite ; autre valeur = paysage fixe.
    seed: 0

# Paramètres du mineur
mineur:
  allowed-worlds: [world]
  stop-at-y: -58

  # true reproduit les mises à jour naturelles (sable/gravier, fluides, redstone).
  apply-physics: true

  # Décors secondaires des anciennes carrières (supports de pierre,
  # torches murales et escalier périphérique). Le puits central sécurisé des
  # cabanes v2 reste actif indépendamment de cette option.
  allow-block-placement: false
  default:
    pattern: QUARRY
    speed: NORMAL
    torch-layers: 4
    supports-every: 8
    use-barrel-master: false

  # Outil virtuel utilisé pour calculer correctement les drops des minerais.
  tool:
    material: NETHERITE_PICKAXE

  # Mode sûr : le propriétaire doit être connecté pour fournir un vrai Player
  # aux plugins de protection. Pour travailler hors ligne, mettre les trois
  # options ci-dessous à false en connaissance de cause.
  protection:
    require-owner-online: true
    fire-block-break-event: true
    fire-block-place-event: true

  # Persistance de l'acteur visuel. La session reste la source de vérité :
  # après un redémarrage, /kill ou une suppression par un autre plugin, un seul
  # PNJ signé est recréé et les éventuels anciens exemplaires sont supprimés.
  persistence:
    entity-watchdog-interval-ticks: 20
    entity-recovery-delay-ticks: 2

  storage:
    barrel-search-radius: 6
    barrel-search-height: 2
    # Distance horizontale maximale depuis le bord de l'emprise minée.
    maximum-distance: 24
    # Compte les blocs de coffre : 32 = 16 coffres doubles.
    max-containers: 32

  # Chevalement automatique construit autour de toute nouvelle mine qui
  # n'utilise pas le mode manuel « tonneau maître ».
  structure:
    enabled: true

    # La plateforme supérieure se trouve cinq blocs au-dessus du niveau choisi.
    # Les valeurs sont bornées entre 4 et 6.
    platform-height: 5

    # Le pavillon fermé reste carré, grandit selon le plus grand côté de la mine,
    # puis demeure plafonné pour éviter une toiture démesurée. Le cadre, les
    # piliers et les passerelles suivent toujours l'emprise complète de la carrière.
    cabin-min-size: 15
    cabin-max-size: 17
    wall-height: 5

    # Espacement vertical entre les éclairages du puits central. La valeur est
    # automatiquement bornée entre 3 et 16 blocs.
    shaft-light-interval: 5

    # 16 coffres doubles = 864 emplacements d'inventaire.
    # La valeur effective respecte aussi storage.max-containers.
    double-chests: 16

    # Profondeur maximale de recherche d'un sol stable sous chacun des 4 piliers.
    foundation-depth: 6

    # Budget de sécurité comprenant blocs posés, dégagements et fondations.
    max-planned-blocks: 12000

    # Déclenche des événements Bukkit de casse/pose synthétiques afin que les
    # plugins de claims puissent refuser la construction. Le propriétaire doit
    # alors être connecté, ce qui est toujours le cas lors d'un nouveau /mineur.
    fire-protection-events: true

  branch:
    spacing: 6        # espacement entre deux branches sur l'axe X
    gallery-width: 3  # largeur de la galerie principale (en blocs)

  tunnel:
    # Je creuse un tunnel de 10 blocs de large sur 3 blocs de haut et je
    # progresse par sections de 10 blocs dans la direction choisie.
    section-size: 10
    height: 3
    max-height: 8
    # Je laisse le nombre de sections ouvert, mais je borne toujours le chantier
    # à 2 048 blocs de sa base pour protéger le serveur.
    max-sections: 0
    max-distance-from-base: 2048

    infrastructure:
      # J'équipe chaque section de pieds, de poutres en bois et de lumières ;
      # la salle d'arrivée reçoit aussi ses plateformes et installations.
      enabled: true
      # Je borne tout plan (scan, scellements et décor) ; la valeur runtime est
      # plafonnée à 20 000 pour éviter une grosse allocation sur un seul tick.
      max-planned-blocks-per-section: 4096
      # Je répartis les poses, retraits et décorations sur plusieurs ticks.
      operations-per-tick: 64
      # Je borne aussi les lectures du monde pendant la recherche des fluides.
      fluid-inspections-per-tick: 512
      support-spacing: 5
      first-support-offset: 3
      light-every-frames: 1
      central-aisle-width: 3
      arrival-platform-depth: 4
      post-material: SPRUCE_FENCE
      beam-material: STRIPPED_SPRUCE_LOG
      floor-material: SPRUCE_PLANKS
      light-material: SHROOMLIGHT

      # Je draine uniquement le volume actif. Je vitre les contacts fluides et
      # les ouvertures de grotte par lesquelles eau ou lave pourraient revenir.
      glass-material: LIGHT_BLUE_STAINED_GLASS
      fluids-enabled: true

    arrival-room:
      # Je construis cette salle une seule fois, lors du premier passage de la
      # carrière vers le tunnel, avant de poursuivre les sections ordinaires.
      enabled: true
      width: 15
      depth: 15
      height: 5

  vein:
    scan-radius: 5
    max-blocks: 96
    scan-every-blocks: 8

  limits:
    max-sessions-per-player: 1
    max-width: 64
    max-length: 64
    max-area: 4096
    max-loaded-chunks: 64
    max-trusted-players: 64

  economy:
    enable: false
    cost-per-layer: 0

# Paramètres des gardes royaux
garde:
  # Distance maximale hors combat avant un rappel sécurisé près du propriétaire.
  # Elle est automatiquement relevée si nécessaire pour contenir la formation et sa recherche sûre.
  follow-radius: 20

  # Formation en V ouvert derrière le regard du joueur : un garde de chaque côté.
  # Les valeurs trop serrées sont automatiquement éloignées de la zone personnelle.
  formation-side-distance: 2.25
  formation-rear-distance: 1.75
  # Marge dans laquelle le garde est considéré correctement placé et arrête son ancien chemin.
  formation-tolerance: 0.9
  # Zone interdite autour du joueur et longueur du cône dégagé devant sa caméra.
  personal-space-radius: 1.65
  view-clearance-distance: 4.0

  # Zone locale de protection ; elle sert aussi de minimum à la laisse de combat.
  protection-radius: 32
  # Rayon du balayage périodique de secours pour les cibles injectées sans événement Bukkit.
  # Pour protéger le thread serveur, ce scan local est borné à 64 blocs ; les événements
  # directs peuvent toujours engager une cible jusqu'à combat-leash-radius.
  threat-detection-radius: 32
  # Une cible déjà engagée peut être poursuivie plus loin afin d'être réellement achevée.
  # La valeur effective ne sera jamais inférieure à protection-radius.
  combat-leash-radius: 48

  # Le duo assiste chaque attaque valide du propriétaire, y compris ses projectiles
  # et les coups portés à une partie de l'Ender Dragon (le parent vivant est ciblé).
  assist-owner-attacks: true
  # Le duo intercepte les mobs qui prennent le propriétaire ou l'un des gardes pour cible avant le premier dégât.
  proactive-defense: true
  # true conserve une cible engagée jusqu'à sa mort ou sa sortie de la laisse de combat.
  finish-engaged-targets: true
  # Utilisé uniquement lorsque finish-engaged-targets vaut false.
  threat-duration-seconds: 10

  respawn-delay-seconds: 20
  # false protège les gardes contre les coups accidentels du propriétaire et de son propre duo.
  friendly-fire: false

  # Les Husks sont des monstres pour la règle vanilla du lit. true autorise le sommeil uniquement
  # lorsqu'ils sont les seuls ennemis proches et qu'aucun garde d'un autre joueur ne menace le dormeur.
  # Une interdiction explicite d'un plugin de protection et tout vrai monstre restent prioritaires.
  allow-sleep-near-guards: true
  # Empêche les gardes d'altérer les blocs (œufs de tortue, terre labourée, portes cassées, etc.).
  # Les portes peuvent toujours être ouvertes par leur pathfinder et les plaques de pression restent actives.
  prevent-block-damage: true

  # true empêche tous les golems de fer (naturels, villageois ou créés par MineGus)
  # de conserver un garde royal comme cible et bloque leurs dégâts.
  iron-golem-neutrality: true
  # Rayon partagé du filet de sécurité local des golems contre une cible injectée sans
  # événement Bukkit. Le nom historique de la clé est conservé pour les configurations existantes.
  # Le contrôle principal reste événementiel ; ce balayage borné ne s'exécute qu'une fois par seconde.
  iron-golem-neutrality-radius: 32
  # Si un golem de fer parvient malgré tout à tenter une frappe, les dégâts restent annulés
  # et le duo contre-attaque. Passez à false pour une neutralité strictement pacifique.
  iron-golem-retaliation: true
  # Les golems de neige attaquent eux aussi les Husks. true annule cette hostilité et leurs
  # projectiles résiduels sans ordonner aux gardes de tuer une défense amicale de la base.
  snow-golem-neutrality: true

  # Messages lors de la mort et du retour d'un garde.
  notifications: true
  attributes:
    max-health: 100.0
    attack-damage: 16.0
    movement-speed: 0.35
    # Automatiquement relevée au moins à la laisse de combat effective.
    follow-range: 48.0
    knockback-resistance: 0.6

# Paramètres de l'éleveur
# Limite d'animaux par espèce dans un enclos
# Temps de restock du PNJ en ticks
# Chance en pourcent d'obtenir de la viande cuite
# Prix en émeraudes pour 64 viandes

eleveur:
  animal-limit: 5
  villager-restock-ticks: 6000   # 5 mn
  loot-cooked-chance: 5          # %
  species: [CHICKEN, COW, PIG, SHEEP, RABBIT]
  emerald-price:
    raw-stack: 1   # 64 viandes crues  => 1 émeraude
    cook-stack: 2  # 64 viandes cuites => 2 émeraudes

# Paramètres du village
village:
  layout-style: semi_organic
  houseSmall: 9
  houseBig: 11
  roadHalf: 2
  # Pas centre-à-centre des îlots (et non une marge ajoutée à la maison).
  spacing: 20
  # Taille impaire ; 15 forme une vraie place de marché sans casser la densité.
  plazaSize: 15
  # 5 x 7 produit une ville d'environ 181 x 146 blocs avec 28 à 32 logements.
  rows: 5
  cols: 7
  houseCountMin: 26
  houseCountMax: 32
  mainStreetHalf: 2
  sideStreetHalf: 1
  terrainMaxStep: 2
  # none | low | medium | high
  decorDensity: high
  # Respiration minimale entre les derniers jardins et la face intérieure.
  wallGap: 8

  # Chambre forte royale construite sous le donjon par /village.
  treasury:
    enabled: true

    # Seul le créateur du village (le roi) ouvre les portes et les coffres.
    # La permission mineplugin.village.treasury.admin contourne cette règle.
    owner-only-containers: true
    door-open-seconds: 6

    # Entretien léger : échéances, dépôts, barre de zone et registre.
    maintenance-period-ticks: 20
    autosave-seconds: 30

    tax:
      # Une collecte globale est planifiée aléatoirement entre 1 et 60 secondes.
      # Ce n'est volontairement pas une collecte par coffre afin que la réserve
      # se remplisse lentement malgré ses soixante coffres.
      min-interval-seconds: 1
      max-interval-seconds: 60

      # Les échéances continuent hors ligne sans forcer le chargement des chunks.
      # Les plafonds bornent le rattrapage après une très longue interruption.
      max-pending: 512
      catch-up-limit-per-cycle: 256
      deposits-per-cycle: 1

      # Quantité de la ressource choisie ; la taille maximale propre à l'objet
      # reste toujours respectée (les objets non empilables restent unitaires).
      minimum-item-amount: 1
      maximum-item-amount: 16

  # Garnison persistante créée automatiquement à la fin de /village.
  knights:
    enabled: true

    # Trois patrouilles de quatre donnent plusieurs groupes visibles sans
    # saturer le pathfinding. soldiers-per-patrol est borné entre 3 et 5.
    urban-patrols: 3
    soldiers-per-patrol: 4

    # Postes fixes organisés par fonction. Chaque valeur est bornée entre
    # 0 et 4 ; deux gardes permettent d'encadrer une entrée sans la bloquer.
    posts:
      gate: 2
      plaza: 2
      keep-entrance: 2
      keep-interior: 2

    # Les archers ne sont créés que si le chemin de ronde construit est
    # réellement praticable. Sinon le village conserve seulement les fantassins.
    wall-archers:
      enabled: true
      count: 4

    # Une mort est persistée immédiatement ; le délai continue pendant un
    # redémarrage et vaut exactement une minute par défaut.
    respawn-delay-seconds: 60

    # Le gestionnaire répartit ses scans entre les cycles et ne charge jamais
    # un chunk uniquement pour déplacer ou recréer un chevalier.
    maintenance-period-ticks: 10
    scans-per-cycle: 4
    detection-radius: 24
    assistance-radius: 36
    combat-leash-radius: 48
    protection-margin: 16
    max-responders-per-threat: 3

    patrol-speed: 0.85
    waypoint-arrival-radius: 2.75
    route-advance-timeout-seconds: 25
    missing-entity-loaded-checks: 3
    stuck-seconds: 20

    navigation:
      # L'ordre de déplacement n'est pas réémis chaque cycle : l'IA vanilla
      # dispose ainsi de 1,5 seconde pour calculer et suivre son chemin.
      path-refresh-ticks: 30
      # Recherche locale d'un sol libre lorsque du mobilier masque un point.
      local-target-search-radius: 2
      # Après ce délai, un garde bloqué est replacé même s'il est observé.
      hard-recovery-seconds: 40

    leashes:
      # Les sentinelles restent attachées à leur poste, les archers à la
      # courtine ; seules les patrouilles urbaines couvrent toute la ville.
      sentry-engagement-radius: 10.0
      sentry-return-radius: 2.0
      rampart-engagement-radius: 16.0
      rampart-corridor-radius: 2.5
      urban-combat-margin: 8.0

    attributes:
      # L'armure en netherite est volontairement non enchantée. Le multiplicateur
      # de dégâts entrants compense sa forte protection afin qu'un chevalier
      # gagne généralement contre 1 zombie, parfois 2, mais puisse mourir.
      max-health: 26.0
      melee-damage-cap: 6.0
      arrow-damage-cap: 5.0
      movement-speed: 0.27
      follow-range: 40.0
      knockback-resistance: 0.25
      incoming-hostile-damage-multiplier: 2.75

  # Population de la ville. Les spawners sont répartis entre les quartiers et
  # partagent un quota persistant pour protéger les performances du serveur.
  population:
    initial-residents: 14
    villager-spawners: 8
    cap: 56
    # 0 = habitants persistants jusqu'à /village undo ou suppression manuelle.
    lifetime-minutes: 0
    spawner:
      # 60 à 120 secondes entre deux tentatives (20 ticks = 1 seconde).
      min-delay-ticks: 1200
      max-delay-ticks: 2400
      max-nearby-entities: 4
      required-player-range: 24
      spawn-range: 3

  # Passe lumineuse finale du village (les lampadaires de rue restent liés au décor).
  lighting:
    enabled: true
    # Compléments visibles du puits et de la promenade intérieure.
    decorative: true
    # Audit des surfaces sombres avec des blocs LIGHT invisibles.
    spawn-proof: true
    # Niveau des blocs LIGHT ajoutés par l'audit (4 à 15).
    hidden-light-level: 12
    # Marge de sécurité : la correction vise au moins ce niveau de lumière de bloc.
    target-min-block-light: 2
    # Petites tuiles pour lisser le coût de l'audit dans la file de génération.
    scan-tile-size: 7
    # Hauteur contrôlée au-dessus du sol : intérieurs, toits, tours et clochers.
    scan-height: 30
    # Espacement des bornes lumineuses placées le long de la muraille.
    perimeter-lantern-spacing: 14
    # Garde-fou pour une configuration de village anormalement grande.
    max-hidden-lights: 4096


# Progression globale du joueur, totalement indépendante du métier Mineur.
#
# Le niveau 1 est le niveau de référence (aucun bonus). Chaque level-up ajoute
# le pourcentage configuré : le niveau 100 donne donc +99 % avec les valeurs
# par défaut. La courbe ci-dessous demande 1 536 546 XP au total pour le niveau 100.
progression:
  enabled: true
  max-level: 100

  # XP requise pour passer du niveau N au niveau N+1 :
  # base + linear * (N - 1) + quadratic * (N - 1)^2
  xp-levelup:
    base: 200
    linear: 50
    quadratic: 4

  bonuses:
    # Les valeurs représentent le gain réel visé par level-up.
    health-percent-per-level: 1.0
    # L'attribut vanilla multiplie la durée moyenne par (1 + bonus).
    oxygen-percent-per-level: 1.0
    damage-percent-per-level: 1.0
    mining-speed-percent-per-level: 1.0

  display:
    # Sidebar vanilla temporaire en haut à droite lors d'un gain d'XP.
    sidebar-on-gain: true
    hud-hide-delay-seconds: 4
    progress-bar-segments: 10
    # Repli si la sidebar n'est pas disponible dans l'environnement courant.
    actionbar-fallback: true
    title-on-levelup: true
    sound-on-levelup: true

  anti-abuse:
    # Un gain issu du gameplay est borné individuellement puis sur une minute.
    # Les commandes admin ne sont pas concernées par ces deux limites.
    max-single-award: 2000
    max-xp-per-minute: 5000
    # Noms de mondes, insensibles à la casse, où aucun XP global n'est gagné.
    disabled-worlds: []

  sources:
    blocks:
      # Empêche de gagner l'XP d'un minerai avec un outil qui ne le récolte pas.
      require-preferred-tool: true
      # Un plugin qui annule les drops annule aussi l'XP de progression.
      require-drops: true

      # Les blocs posés, formés ou générés par /village puis cassés ne donnent
      # pas d'XP. Le marquage est persistant dans le PDC de chaque chunk.
      track-placed-blocks: true
      placed-blocks-max-per-chunk: 16384
      placed-blocks-flush-seconds: 5

      # La présence de cette section remplace la table interne par défaut.
      xp-per-block:
        STONE: 1
        COBBLESTONE: 1
        DEEPSLATE: 1
        TUFF: 1
        NETHERRACK: 1
        END_STONE: 2
        OBSIDIAN: 5

        COAL_ORE: 3
        DEEPSLATE_COAL_ORE: 4
        COPPER_ORE: 4
        DEEPSLATE_COPPER_ORE: 5
        IRON_ORE: 5
        DEEPSLATE_IRON_ORE: 6
        GOLD_ORE: 7
        DEEPSLATE_GOLD_ORE: 8
        REDSTONE_ORE: 6
        DEEPSLATE_REDSTONE_ORE: 7
        LAPIS_ORE: 7
        DEEPSLATE_LAPIS_ORE: 8
        DIAMOND_ORE: 12
        DEEPSLATE_DIAMOND_ORE: 14
        EMERALD_ORE: 15
        DEEPSLATE_EMERALD_ORE: 17
        NETHER_QUARTZ_ORE: 4
        NETHER_GOLD_ORE: 6
        ANCIENT_DEBRIS: 25

        OAK_LOG: 2
        SPRUCE_LOG: 2
        BIRCH_LOG: 2
        JUNGLE_LOG: 2
        ACACIA_LOG: 2
        DARK_OAK_LOG: 2
        MANGROVE_LOG: 2
        CHERRY_LOG: 2
        PALE_OAK_LOG: 2
        CRIMSON_STEM: 2
        WARPED_STEM: 2
        CRIMSON_HYPHAE: 2
        WARPED_HYPHAE: 2

    farming:
      # Seules les cultures arrivées à leur âge maximal donnent cet XP.
      xp-per-mature-crop:
        WHEAT: 2
        CARROTS: 2
        POTATOES: 2
        BEETROOTS: 2
        NETHER_WART: 3
        COCOA: 2
        TORCHFLOWER_CROP: 3
        PITCHER_CROP: 3

    combat:
      # Utilisé lorsqu'une entité n'est pas explicitement listée plus bas.
      fallback:
        monster: 10
        animal: 3
        # Désactivé par défaut pour ne pas créer de ferme PvP entre complices.
        player: 0
        other: 0

      # Une valeur 0 désactive explicitement l'entité concernée.
      xp-per-entity:
        PLAYER: 0
        ENDER_DRAGON: 1000
        WITHER: 750
        WARDEN: 500
        ELDER_GUARDIAN: 100
        RAVAGER: 60
        EVOKER: 40
        PIGLIN_BRUTE: 30
        GHAST: 18
        BREEZE: 16
        BLAZE: 15
        SHULKER: 15
        VINDICATOR: 15
        WITHER_SKELETON: 14
        ZOGLIN: 14
        ENDERMAN: 12
        GUARDIAN: 12
        PHANTOM: 12
        HOGLIN: 12
        CREEPER: 12
        BOGGED: 12

      # Multiplicateur selon l'origine de spawn fournie par Paper pour l'entité.
      # Les raisons absentes de cette liste utilisent 1.0.
      spawn-reason-multipliers:
        SPAWNER: 0.25
        TRIAL_SPAWNER: 0.50
        SPAWNER_EGG: 0.0
        DISPENSE_EGG: 0.0
        BREEDING: 0.0
        BUILD_IRONGOLEM: 0.0
        BUILD_SNOWMAN: 0.0
        COMMAND: 0.0
        CUSTOM: 0.0

    fishing:
      caught-fish-xp: 5
      caught-entity-xp: 2

    breeding:
      xp: 8

    taming:
      xp: 20

    trading:
      xp: 4

    shearing:
      xp: 3

    enchanting:
      base-xp: 5
      xp-per-cost-level: 0.5

    smelting:
      xp-per-item: 0.25
      xp-per-vanilla-xp: 1.0
      max-xp-per-extraction: 100

    advancements:
      default-xp: 50
      ignore-recipes: true
      # Les clés doivent être entre guillemets à cause du caractère ':'.
      xp-per-advancement:
        "minecraft:end/kill_dragon": 250
        "minecraft:nether/summon_wither": 200
        "minecraft:adventure/hero_of_the_village": 150
        "minecraft:adventure/kill_all_mobs": 300
        "minecraft:husbandry/balanced_diet": 150
        "minecraft:nether/all_effects": 250

# Paramètres des métiers
jobs:
  mineur:
    max-level: 100
    xp-levelup:
      base: 200
      linear: 50
      quadratic: 4
    bonus:
      speed-percent-per-level: 1.0
      mineurs:
        base: 1
        first-extra-level: 20
        every-levels: 10
        max: 10
    display:
      bossbar-on-gain: true
      hud-hide-delay-seconds: 4
      actionbar-on-gain: true
      title-on-levelup: true
    xp-per-block:
      STONE: 1
      COBBLESTONE: 1
      DEEPSLATE: 1

      COAL_ORE: 3
      DEEPSLATE_COAL_ORE: 3

      COPPER_ORE: 4
      DEEPSLATE_COPPER_ORE: 4

      IRON_ORE: 5
      DEEPSLATE_IRON_ORE: 5

      GOLD_ORE: 6
      DEEPSLATE_GOLD_ORE: 6

      REDSTONE_ORE: 6
      DEEPSLATE_REDSTONE_ORE: 6

      LAPIS_ORE: 7
      DEEPSLATE_LAPIS_ORE: 7

      DIAMOND_ORE: 10
      DEEPSLATE_DIAMOND_ORE: 10

      EMERALD_ORE: 12
      DEEPSLATE_EMERALD_ORE: 12

      NETHER_QUARTZ_ORE: 4
      NETHER_GOLD_ORE: 6

# Exploitation forestière automatisée (/foret et /bucheron).
forester-v2:
  enabled: true
  # Nombre de parcelles par joueur ; les administrateurs ne sont pas limités.
  max-areas-per-player: 2
  # Écart vertical maximal accepté avant de refuser une création.
  maximum-terrain-variation: 3
  # Délai de pousse assistée. La pousse vanilla reste également acceptée.
  growth-min-seconds: 120
  growth-max-seconds: 240
  # Limite le nombre de blocs coupés par cycle pour lisser la charge serveur.
  harvest-blocks-per-cycle: 3
  storage-retry-seconds: 30
  # Sauvegarde la poche et l'état même pendant une coupe en cours.
  autosave-seconds: 10
  task-period-ticks: 2
  # Maintient tous les chunks de la parcelle chargés via des tickets partagés.
  keep-chunks-loaded: true
  # Garantit la continuité si aucun jeune arbre ne tombe.
  emergency-saplings: true
  # Empêche les joueurs, explosions, pistons et feu d'endommager la zone.
  protect-area: true
