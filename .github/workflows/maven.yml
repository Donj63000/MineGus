name: Vérifications

on:
  push:
  pull_request:

# Les workflows n'ont besoin que de lire le dépôt.
permissions:
  contents: read

jobs:
  java:
    name: Plugin Java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et exécuter les tests
        run: mvn -B --no-transfer-progress verify

  lanceur-python:
    name: Lanceur Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exécuter les tests du lanceur
        run: >-
          python -m unittest discover
          -s tools/augustin_launcher/tests
          -t tools/augustin_launcher
          -v
